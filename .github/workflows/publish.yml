name: "🚀 publish"

on:
  push:
    branches:
      - master
    tags:
      - "v*"

jobs:
  check:
    name: 🔍 check
    runs-on: ubuntu-latest
    steps:
      - name: 📚 checkout
        uses: actions/checkout@v4

      - name: 🟢 node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: the package loads and sums
        run: |
          cat > /tmp/check.js <<'JS'
          const { arrayKeySum } = require(process.cwd() + '/index.js')
          const got = arrayKeySum([{ c: 1 }, { c: 2 }], 'c')
          if (got !== 3) throw new Error('expected 3, got ' + got)
          const empty = arrayKeySum([], 'c')
          if (empty !== 0) throw new Error('expected 0 for an empty array, got ' + empty)
          console.log('arrayKeySum =>', got, '| empty array =>', empty)
          JS
          node /tmp/check.js

      - name: what would be published
        run: npm pack --dry-run

  publish:
    name: 🚀 publish
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📚 checkout
        uses: actions/checkout@v4

      - name: 🟢 node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: 🚀 publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
